[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leaps-custom-harness"
version = "0.1.0"
description = "CLI-first orchestration harness for closed-network AI workflows."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
leaps-harness = "leaps_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
